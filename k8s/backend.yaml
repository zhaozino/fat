apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: lightfit
type: Opaque
stringData:
  JWT_SECRET: changeme-must-be-at-least-32-chars-long!!
  DASHSCOPE_API_KEY: ""
  SMS_SECRET_ID: ""
  SMS_SECRET_KEY: ""
  SMS_APP_ID: ""
  SMS_TEMPLATE_ID: ""
  COS_SECRET_ID: ""
  COS_SECRET_KEY: ""
  COS_BUCKET: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lightfit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: lightfit-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/lightfit?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: com.mysql.cj.jdbc.Driver
            - name: SERVER_PORT
              value: "8080"
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/api"
            - name: jwt.secret
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: jwt.expire-days
              value: "7"
            - name: sms.secret-id
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMS_SECRET_ID
            - name: sms.secret-key
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMS_SECRET_KEY
            - name: sms.app-id
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMS_APP_ID
            - name: sms.sign-name
              value: "轻享瘦"
            - name: sms.template-id
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SMS_TEMPLATE_ID
            - name: sms.mock-mode
              value: "true"
            - name: cos.secret-id
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: COS_SECRET_ID
            - name: cos.secret-key
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: COS_SECRET_KEY
            - name: cos.region
              value: "ap-guangzhou"
            - name: cos.bucket
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: COS_BUCKET
            - name: dashscope.api-key
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DASHSCOPE_API_KEY
          envFrom:
            - secretRef:
                name: backend-secret
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lightfit
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
