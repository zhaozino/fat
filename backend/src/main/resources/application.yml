server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:lightfit}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

jwt:
  secret: ${JWT_SECRET:changeme-must-be-at-least-32-chars-long!!}
  expire-days: ${JWT_EXPIRE_DAYS:7}

sms:
  secret-id: ${SMS_SECRET_ID:}
  secret-key: ${SMS_SECRET_KEY:}
  app-id: ${SMS_APP_ID:}
  sign-name: ${SMS_SIGN_NAME:}
  template-id: ${SMS_TEMPLATE_ID:}
  mock-mode: ${SMS_MOCK_MODE:true}

cos:
  secret-id: ${COS_SECRET_ID:}
  secret-key: ${COS_SECRET_KEY:}
  region: ${COS_REGION:ap-guangzhou}
  bucket: ${COS_BUCKET:}

dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
